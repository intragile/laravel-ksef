name: install

# Installs the published metapackage into a fresh Laravel application and runs the doctor.
# Requires intragile/laravel-ksef and its dependencies on Packagist, so it works after the release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, zlib, sqlite3, pdo_sqlite, openssl
          coverage: none
      - run: composer validate --strict
      - name: Create a fresh Laravel application
        run: composer create-project "laravel/laravel:${{ matrix.laravel }}" app --no-interaction --no-progress --prefer-dist
      - name: Require the metapackage
        working-directory: app
        run: composer require intragile/laravel-ksef:^1.0 --no-interaction --no-progress
      - name: Run the doctor
        working-directory: app
        # Placeholder configuration: the doctor only checks that it is present and well formed.
        # The test environment is the only one this job ever points at. The RECOMMAND keys satisfy the
        # default Peppol transport, which the doctor checks as well.
        env:
          RECOMMAND_API_KEY_ID: key_placeholder
          RECOMMAND_API_SECRET: secret_placeholder
          RECOMMAND_COMPANY_ID: c_placeholder
          KSEF_ENVIRONMENT: test
          KSEF_NIP: "5265877635"
          KSEF_TOKEN: placeholder-token-not-used
        run: |
          php artisan einvoicing:install-rules
          php artisan migrate --force --no-interaction
          php artisan einvoicing:doctor
